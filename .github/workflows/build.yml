jobs:
  build:
    name: Unzip và build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Giải nén mã nguồn
        run: |
          set -e
          mkdir -p _src
          if [ -f "$ZIP_FILE" ]; then
            ZIP="$ZIP_FILE"
          else
            ZIP="$(ls -1 *.zip 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "$ZIP" ]; then
            echo "Giải nén: $ZIP"
            unzip -q -o "$ZIP" -d _src
          elif [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Không có file zip, dùng mã nguồn ở thư mục gốc"
            cp -r ./. _src/ 2>/dev/null || true
          else
            echo "::error::Không tìm thấy file zip mã nguồn ($ZIP_FILE)"
            exit 1
          fi
          SETTINGS="$(find _src -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' | head -n1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle(.kts) trong mã nguồn"
            exit 1
          fi
          PROJECT_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Thư mục project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài gói SDK cần thiết
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cài Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Khôi phục keystore
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/app/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$PROJECT_DIR/app/keystore/mimi-release.jks"
          keytool -list -keystore "$PROJECT_DIR/app/keystore/mimi-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | tail -n 3

      - name: Build APK (release, đã ký)
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Kiểm tra chữ ký APK
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name '*.apk' | head -n1)"
          echo "APK: $APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -n 12
          mkdir -p dist
          cp "$APK" "dist/MimiAI-v1.0.${{ github.run_number }}.apk"
          ls -la dist

      - name: Tải APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MimiAI-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Tạo bản Release (để tải APK trực tiếp từ điện thoại)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MimiAI v1.0.${{ github.run_number }}
          files: dist/*.apk
