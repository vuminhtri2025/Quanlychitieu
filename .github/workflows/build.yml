name: Build APK

on:
  push:
    paths: ['source.zip', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keystore (PKCS12) mã hóa base64 - alias: chitieu, mật khẩu: chitieu2026 (khớp app/build.gradle.kts)
      KEYSTORE_B64: 
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip source
        run: |
          rm -rf src_build && mkdir src_build
          unzip -q -o source.zip -d src_build
          SETTINGS=$(find src_build -maxdepth 2 -name 'settings.gradle*' | head -1)
          test -n "$SETTINGS" || { echo "Không thấy settings.gradle trong source.zip"; exit 1; }
          echo "ROOT=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Restore keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$ROOT/app/chitieu.jks"

      - name: Build release APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$ROOT"/app/build/outputs/apk/release/*.apk ChiTieuAI.apk

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs ChiTieuAI.apk
          else
            echo "Không tìm thấy apksigner, bỏ qua bước kiểm tra chữ ký"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ChiTieuAI-apk
          path: ChiTieuAI.apk

      - name: Publish release (tải APK trực tiếp trên điện thoại)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chi Tiêu AI v${{ github.run_number }}
          files: ChiTieuAI.apk
