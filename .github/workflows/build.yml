name: Build APK

# Dat file nay tai: .github/workflows/build.yml
# Dat file zip ma nguon Android (ten bat ky, duoi .zip) o thu muc goc cua repo.
on:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keystore tich hop san: moi lan build deu ky cung 1 khoa => cai de cap nhat len app cu duoc
  KEYSTORE_PASSWORD: vichitieu2026
  KEY_ALIAS: vichitieu
  KEY_PASSWORD: vichitieu2026
  KEYSTORE_B64: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (dung SDK co san tren runner)
        run: |
          set +o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          mkdir -p "$SDK/licenses"
          # Ghi san ma license de khong bi hoi (y/N) -> khong bi treo/loi
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "Da chap nhan license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip source (tu nhan file zip, bat ke ten)
        run: |
          set -e
          shopt -s nullglob nocaseglob
          ZIPS=(*.zip)
          [ ${#ZIPS[@]} -gt 0 ] || { echo "Khong tim thay file .zip nao o thu muc goc repo"; exit 1; }
          rm -rf project
          FOUND=""
          for Z in "${ZIPS[@]}"; do
            echo "Kiem tra: $Z"
            rm -rf project && mkdir project
            unzip -q -o "$Z" -d project || continue
            SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)
            if [ -n "$SETTINGS" ]; then FOUND="$SETTINGS"; echo "Dung file zip: $Z"; break; fi
          done
          [ -n "$FOUND" ] || { echo "Khong file zip nao chua settings.gradle.kts"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$FOUND")"

      - name: Check project structure
        run: |
          cd "$PROJECT_DIR"
          for f in settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts \
                   app/src/main/AndroidManifest.xml app/src/main/java/com/vichitieu/app/MainActivity.kt; do
            test -f "$f" || { echo "THIEU FILE: $f"; exit 1; }
          done
          echo "Cau truc hop le"

      - name: Restore keystore
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$PROJECT_DIR/app/release.jks"
          keytool -list -keystore "$PROJECT_DIR/app/release.jks" -storepass "$KEYSTORE_PASSWORD" | head -n 5

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk out/ViChiTieu.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViChiTieu-apk
          path: out/ViChiTieu.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vi Chi Tieu build ${{ github.run_number }}
          files: out/ViChiTieu.apk
