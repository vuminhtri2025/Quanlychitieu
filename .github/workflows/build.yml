name: Build APK

# Dat file nay tai: .github/workflows/build.yml
# Dat file source.zip (ma nguon Android) o thu muc goc cua repo.
on:
  push:
    branches: [main, master]
    paths:
      - 'source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Thong tin keystore (tich hop san de moi lan build deu ky cung 1 khoa => cap nhat de len app cu duoc)
  KEYSTORE_PASSWORD: chitieu2026
  KEY_ALIAS: chitieu
  KEY_PASSWORD: chitieu2026
  KEYSTORE_B64: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK co san tren runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip source
        run: |
          set -e
          test -f source.zip || { echo "Khong tim thay source.zip o thu muc goc repo"; exit 1; }
          rm -rf project
          mkdir project
          unzip -q -o source.zip -d project
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS" || { echo "Khong tim thay settings.gradle.kts trong source.zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$SETTINGS")"

      - name: Restore keystore
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$PROJECT_DIR/app/release.jks"
          keytool -list -keystore "$PROJECT_DIR/app/release.jks" -storepass "$KEYSTORE_PASSWORD" | head -n 5

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk out/ChiTieu.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiTieu-apk
          path: out/ChiTieu.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chi Tieu build ${{ github.run_number }}
          files: out/ChiTieu.apk
